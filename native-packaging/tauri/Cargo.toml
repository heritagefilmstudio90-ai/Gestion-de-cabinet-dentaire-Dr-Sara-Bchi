[package]
name = "dentaflow-pro"
version = "1.0.0"
description = "Gestion de cabinet dentaire Dr. Sara Bchi — Logiciel de gestion de cabinet dentaire hors ligne et multi-utilisateurs"
authors = ["Cabinet Dentaire Dr. Sara Bchi"]
edition = "2021"

[lib]
name = "dentaflow_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
